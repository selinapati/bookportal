<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Book List</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main>
        <nav>
            <div class="nav-left">
                <h1><a href="/">Book List</a></h1>
            </div>
        </nav>
        <section class="book-grid" id="bookGrid">
            <!-- Display success or error messages -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            
            <!-- Thymeleaf loop to display each book in the grid -->
            <div th:each="book : ${bookBorrow}">
                <div class="book-card">
                    <img th:src="${book.imageUrl}" alt="Book Cover" />
                    <h3 th:text="${book.title}">Book Title</h3>
                    <p>Author: <span th:text="${book.author}">Author Name</span></p>
                    <p>Availability: <span th:text="${book.availableCopies > 0 ? 'Available' : 'Borrowed'}"></span></p>
                    <p>Available Copies: <span th:text="${book.availableCopies}">0</span></p>
                    <br>
                    <!-- Updated form to submit the borrow request -->
                    <form action="/borrowBook" method="post">
                        <input type="hidden" name="booksId" th:value="${book.booksId}" /> <!-- Book ID to be sent -->
                        <input type="submit" value="Borrow" th:disabled="${book.availableCopies == 0}" /> <!-- Disable button if no copies are available -->
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
