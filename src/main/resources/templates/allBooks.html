<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List - KTM Portal</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <nav>
        <div class="nav-left">
            <h1><a href="/admin">Admin Portal</a></h1>
        </div>
    </nav>

    <div class="content">
        <h1>Book Lists</h1>
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Availability</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book, iterStat : ${books}">
                    <td th:text="${iterStat.index + 1}">1</td> <!-- S.No Auto Increment -->
                    <td th:text="${book.booksId}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.availableCopies}"></td>
                    <td>
                        <img th:src="${book.imageUrl}" alt="Book Image" style="width:50px; height:50px;">
                    </td>
                    <td>
                        
                        <form th:action="@{/books/delete}" method="post">
                            <input type="hidden" name="booksId" th:value="${book.booksId}"/>
                            <input type="submit" value="Delete">
                        </form>
                        
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
